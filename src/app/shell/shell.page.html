<div class="shell">
  <header class="shell__header">
    <span class="shell__brand">★ Star Bottons</span>
    <nav class="shell__nav" aria-label="Navegação principal">
      <a
        class="shell__nav-link"
        routerLink="/app/upload"
        routerLinkActive="is-active"
        #uploadLink="routerLinkActive"
        [attr.aria-current]="uploadLink.isActive ? 'page' : null"
      >Novo botton</a>
      <a
        class="shell__nav-link"
        routerLink="/app/mockups"
        routerLinkActive="is-active"
        #mockupsLink="routerLinkActive"
        [attr.aria-current]="mockupsLink.isActive ? 'page' : null"
      >Curadoria de mockups</a>
    </nav>
    <button type="button" class="btn btn--ghost" (click)="logout()">Sair</button>
  </header>

  <div class="shell__stepper">
    @if (batchMode()) {
      <p class="shell__batch-label">Processamento em lote</p>
    } @else if (contextualMode()) {
      <p class="shell__batch-label">Aplicar em cenário</p>
    } @else if (manageMode()) {
      <p class="shell__batch-label">Curadoria de mockups</p>
    } @else {
      <app-stepper [current]="step()" />
    }
  </div>

  <main class="shell__main" id="conteudo">
    <router-outlet />
  </main>
</div>
