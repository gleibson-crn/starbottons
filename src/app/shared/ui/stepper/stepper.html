<nav aria-label="Progresso do fluxo">
  <ol class="stepper">
    @for (step of steps; track step.label; let i = $index) {
      <li
        class="stepper__item"
        [class]="'is-' + state(i)"
        [attr.aria-current]="state(i) === 'current' ? 'step' : null"
      >
        <span class="stepper__marker" aria-hidden="true">
          @if (state(i) === 'done') { ✓ } @else { {{ i + 1 }} }
        </span>
        <span class="stepper__label">{{ step.label }}</span>
        @if (state(i) === 'done') {
          <span class="sr-only">(concluído)</span>
        }
      </li>
    }
  </ol>
</nav>
