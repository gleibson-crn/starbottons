<div class="progress">
  <div class="progress__label">
    <span>{{ label() }}</span>
    @if (!indeterminate) {
      <span aria-hidden="true">{{ clamped }}%</span>
    }
  </div>
  <div
    class="progress__track"
    role="progressbar"
    [attr.aria-label]="label()"
    [attr.aria-valuemin]="indeterminate ? null : 0"
    [attr.aria-valuemax]="indeterminate ? null : 100"
    [attr.aria-valuenow]="indeterminate ? null : clamped"
  >
    <div
      class="progress__bar"
      [class.progress__bar--indeterminate]="indeterminate"
      [style.width.%]="indeterminate ? null : clamped"
    ></div>
  </div>
</div>
