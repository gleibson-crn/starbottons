<div class="overlay">
  <div
    class="dialog card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="batch-edit-title"
  >
    <h2 id="batch-edit-title" class="dialog__title">
      Ajustar “{{ item().name }}”
    </h2>
    <p class="dialog__hint">
      O ajuste e os filtros valem para todos os tamanhos selecionados desta
      imagem.
    </p>

    <!-- Prévia PERSISTENTE (fora das abas): sempre visível para que o usuário
         veja ao vivo o efeito do enquadramento, dos filtros e do fundo,
         independentemente da aba de controles ativa. -->
    <div class="dialog__stage">
      <app-canvas-editor
        [image]="image()"
        [spec]="spec()"
        [filters]="filters()"
        [(transform)]="transform"
      />
    </div>
    <app-resolution-badge [dpi]="dpi()" [dense]="true" />

    <div class="dialog__tabs" role="tablist" aria-label="Modo de edição">
      @for (t of tabs; track t.id) {
        <button
          #tabBtn
          type="button"
          role="tab"
          class="tab"
          [id]="'batch-tab-' + t.id"
          [class.tab--active]="activeTab() === t.id"
          [attr.aria-selected]="activeTab() === t.id"
          [attr.aria-controls]="'batch-panel-' + t.id"
          [tabindex]="activeTab() === t.id ? 0 : -1"
          (click)="selectTab(t.id)"
          (keydown)="onTabKeydown($event)"
        >
          {{ t.label }}
        </button>
      }
    </div>

    <!-- A prévia (canvas) é persistente acima; a aba "Ajustar" traz só as
         instruções de enquadramento e o botão de redefinir. -->
    <div
      role="tabpanel"
      id="batch-panel-adjust"
      aria-labelledby="batch-tab-adjust"
      tabindex="0"
      [hidden]="activeTab() !== 'adjust'"
    >
      <p class="dialog__tabhint">
        Arraste na prévia acima para posicionar e role para dar zoom. Pelo
        teclado: setas movem, + e − ampliam, colchetes giram e R redefine.
      </p>
      <button type="button" class="btn btn--ghost" (click)="resetFraming()">
        Redefinir enquadramento
      </button>
    </div>

    <div
      role="tabpanel"
      id="batch-panel-treat"
      aria-labelledby="batch-tab-treat"
      tabindex="0"
      [hidden]="activeTab() !== 'treat'"
    >
      <app-treat-panel [(filters)]="filters" />
    </div>

    <div
      role="tabpanel"
      id="batch-panel-background"
      aria-labelledby="batch-tab-background"
      tabindex="0"
      [hidden]="activeTab() !== 'background'"
    >
      <app-background-picker
        [color]="transform().background"
        (colorChange)="onBackground($event)"
      />
    </div>

    <div class="dialog__actions">
      <button type="button" class="btn btn--ghost" (click)="onClose()">
        Cancelar
      </button>
      <button type="button" class="btn btn--primary" (click)="onSave()">
        Salvar ajuste
      </button>
    </div>
  </div>
</div>
